name: Daily

on:
  schedule:
    # Temporary test: runs every day at 12:18 Asia/Shanghai (04:18 UTC).
    - cron: "18 4 * * *"
  workflow_dispatch:

jobs:
  daily:
    name: Run daily task
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run tests
        run: python -m pytest

      - name: Restore Playwright storage state
        env:
          BING_STORAGE_STATE_B64: ${{ secrets.BING_STORAGE_STATE_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BING_STORAGE_STATE_B64)) {
            throw "BING_STORAGE_STATE_B64 is not configured"
          }
          New-Item -ItemType Directory -Force ".auth" | Out-Null
          [IO.File]::WriteAllBytes(
            ".auth/storage_state.json",
            [Convert]::FromBase64String($env:BING_STORAGE_STATE_B64)
          )

      - name: Run bing-rewardd tasks
        run: python -m bing_rewardd.cli --storage-state .auth/storage_state.json --screenshot-dir debug_screenshots tasks

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots
          retention-days: 3
