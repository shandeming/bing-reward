name: Daily

on:
  schedule:
    # Runs every day at 09:00 Asia/Shanghai. GitHub schedules use UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  daily:
    name: Run daily task
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run tests
        run: python -m pytest

      - name: Write credentials
        if: env.MS_EMAIL != '' && env.MS_PASSWORD != ''
        env:
          MS_EMAIL: ${{ secrets.MS_EMAIL }}
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
        run: |
          $json = @{
            email    = $env:MS_EMAIL
            password = $env:MS_PASSWORD
          } | ConvertTo-Json -Compress
          $json | Set-Content ".credentials.json" -Encoding UTF8
          Write-Host "Credentials written to .credentials.json"

      - name: Run bing-rewardd tasks
        run: python -m bing_rewardd.cli tasks

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots
          retention-days: 3
