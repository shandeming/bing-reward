name: Daily

on:
  schedule:
    # Runs every day at 09:00 Asia/Shanghai. GitHub schedules use UTC.
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  daily:
    name: Run daily task
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      BROWSER_PROFILE_DIR: D:\Code\bing-rewardd\.browser-profile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run tests
        run: python -m pytest

      - name: Run bing-rewardd tasks
        run: python -m bing_rewardd.cli --profile-dir "$env:BROWSER_PROFILE_DIR" --no-wait --screenshot-dir debug_screenshots tasks

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots
          retention-days: 3
